<title>English Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;600;700;800&family=Bangers&family=IM+Fell+English+SC&family=Pirata+One&family=Uncial+Antiqua&family=New+Rocker&family=Fredericka+the+Great&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;500;600;700&display=swap">
<style>
/* Juego a pantalla completa: lienzo centrado + capas de interfaz. Paleta única nocturna-dorada (decisión deliberada). */
:root{
  --ink:#f6eedd; --ink2:#c9bda6; --ink3:#8f8576; --night:#0b0a12; --panel:rgba(18,15,26,.92); --panel2:rgba(30,26,42,.96); --line:rgba(255,220,150,.22);
  --gold:#ffd25a; --gold2:#e8a83a; --ok:#6be38a; --bad:#ff6a6a; --spell:#ffc04a; --info:#8fd8ff;
  --tri:#3ec98e; --sq:#e57bc7; --ci:#ff5d5d; --cr:#6aa8ff;
  --display:"IM Fell English SC", Georgia, serif; --comic:"Bangers", Impact, sans-serif; --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --fs:19px; color-scheme:dark;
}
:root[data-text="M"]{--fs:16px} :root[data-text="XL"]{--fs:22px}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:var(--fs);overflow:hidden;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--night)}
canvas#game{display:block}
button{font:inherit;color:inherit}
:focus{outline:none}
.gly{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .35em;border-radius:999px;font-weight:800;font-size:.85em;background:#2a2638;border:2px solid #6a6280;color:#fff;line-height:1}
.gly.tri{color:var(--tri);border-color:var(--tri)} .gly.sq{color:var(--sq);border-color:var(--sq)} .gly.ci{color:var(--ci);border-color:var(--ci)} .gly.cr{color:var(--cr);border-color:var(--cr)}
.gly.key{border-radius:6px;background:#2e2a3c;font-size:.75em}
.cefr{display:inline-block;padding:.05em .45em;border-radius:6px;font-weight:800;font-size:.78em;letter-spacing:.04em}
.cefr.A1{background:#2f7a4a;color:#dfffe8} .cefr.A2{background:#2f5a9a;color:#e0ecff} .cefr.B1{background:#8a4a9a;color:#fbe6ff}
.bar{display:inline-block;width:100%;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;vertical-align:middle} .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:5px}
.say{background:none;border:0;cursor:pointer;font-size:1.05em;padding:.1em .3em;border-radius:6px} .say:hover,.say.focus{background:rgba(255,255,255,.12)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;font-family:var(--body)}
#hud.on{opacity:1} body.menu-open #hud,body.menu-open #prompt{opacity:0!important}
.hud-l{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.hud-portrait{position:relative;width:76px;height:76px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.hud-portrait canvas{position:absolute;inset:9px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a5a7a,#141c30);box-shadow:inset 0 0 0 2px rgba(255,236,200,.5)}
.hud-portrait svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hud-portrait .trk{fill:none;stroke:rgba(10,14,26,.72);stroke-width:7}
.hud-portrait .val{fill:none;stroke:url(#ultgrad);stroke-width:5;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;transition:stroke-dashoffset .25s}
.hud-portrait.ready svg{filter:drop-shadow(0 0 6px #ffd25a) drop-shadow(0 0 14px #ffb040);animation:ringp 1s ease-in-out infinite alternate} @keyframes ringp{to{filter:drop-shadow(0 0 10px #fff2b0) drop-shadow(0 0 22px #ffb040)}}
.hud-portrait.broken .val{stroke:#ff5a5a;stroke-dasharray:6 6}
.hud-portrait .ultl{position:absolute;left:0;bottom:-10px;white-space:nowrap;font-family:var(--cinzel);font-weight:700;font-size:.56em;letter-spacing:.12em;color:#ffe7a8;background:rgba(10,14,26,.8);border:1px solid rgba(255,220,150,.4);border-radius:999px;padding:1px 8px}
.hud-bars{display:flex;flex-direction:column;gap:5px;width:min(300px,34vw)}
.hb{position:relative;height:16px;border-radius:999px;background:rgba(8,10,20,.72);box-shadow:inset 0 0 0 1px rgba(255,236,200,.28),0 2px 8px rgba(0,0,0,.4);overflow:hidden}
.hb i{position:absolute;left:2px;top:2px;bottom:2px;border-radius:999px;transition:width .12s} .hb i.ghost{background:rgba(255,236,190,.85);transition:width .6s ease .35s}
.hb.hp i:not(.ghost){background:linear-gradient(180deg,#ff9a86 0%,#e8443a 45%,#a8201e 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.hb.st{height:8px;width:82%} .hb.st i{background:linear-gradient(180deg,#a8f4d0,#3ab88a)}
.hb span{position:absolute;right:10px;top:0;bottom:0;display:flex;align-items:center;font-size:.6em;font-weight:800;letter-spacing:.06em;color:#fff;text-shadow:0 1px 2px #000}
#hud.exposed .hb.hp{box-shadow:inset 0 0 0 1px var(--bad),0 0 16px var(--bad);animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 0 1px var(--bad),0 0 26px var(--bad)}}
.hud-row{display:flex;gap:10px;align-items:center;font-size:.76em;text-shadow:0 2px 4px #000;margin-top:1px}
.hud-row .ics{display:flex;gap:3px} .hud-row .ic{width:1.15em;height:1.15em} .fl-on{color:#ffd27a} .fl-off{color:rgba(255,255,255,.25)} .ru-on{color:#9be6ff} .ru-off{color:rgba(255,255,255,.22)}
.hud-row .wp{color:var(--ink2);font-family:var(--cinzel);letter-spacing:.08em;font-size:.92em}
.hud-r{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wallet-h{display:flex;gap:6px} .wallet-h .chip{font-size:.82em;padding:3px 10px 3px 7px;transform-origin:30% 50%}
.wallet-h .chip.coin.bump{animation:cbump .22s ease-out} .wallet-h .chip.coin.bump .ic{filter:drop-shadow(0 0 6px #ffd848)}
#puzzle-pop{position:fixed;right:18px;top:96px;z-index:60;width:404px;padding:10px;border-radius:16px;background:rgba(14,10,22,.88);border:1px solid rgba(255,220,140,.35);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(255,200,100,.15);transform:translateX(130%);transition:transform .45s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
#puzzle-pop.on{transform:none}
#puzzle-pop .pz-head{display:flex;justify-content:space-between;align-items:baseline;color:#ffe08a;font:700 14px "Alegreya Sans",sans-serif;letter-spacing:.12em;margin:0 4px 6px}
#puzzle-pop .pz-head span{color:#cfc6e0;letter-spacing:0;font-weight:600}
#puzzle-pop canvas{display:block;width:384px;height:216px;border-radius:8px}
#puzzle-pop .pz-word{color:#fff;font:600 17px "Alegreya Sans",sans-serif;text-align:center;margin-top:7px}
#puzzle-pop .pz-word b{color:#ffe08a} #puzzle-pop .pz-word small{display:block;color:#cfc6e0;font-size:13px}
.pz-gallery{margin-top:18px} .pz-gallery h3{margin:0 0 10px}
.pz-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pz-gallery h3{grid-column:1/-1}
.pz-card{background:var(--glass);border:1px solid var(--hair);border-radius:14px;padding:10px}
.pz-card.done{border-color:rgba(255,215,120,.6);box-shadow:0 0 18px rgba(255,200,100,.2)}
.pz-card canvas{width:100%;border-radius:8px;display:block}
.pz-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px} .pz-t small{opacity:.75}
.pz-words{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;font-size:.85em} .pz-words span{background:rgba(255,220,130,.14);color:#ffe9a0;padding:2px 8px;border-radius:99px} .pz-words em{opacity:.6}
@keyframes cbump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.word{display:flex;gap:4px} .word span{width:1.55em;height:1.7em;display:flex;align-items:center;justify-content:center;border-radius:6px;background:linear-gradient(180deg,rgba(20,24,40,.8),rgba(8,10,20,.85));box-shadow:inset 0 0 0 1px rgba(255,220,150,.3);font-family:var(--cinzel);font-weight:700;font-size:1em;color:rgba(255,236,200,.35)}
.word span.got{color:#2a1806;background:linear-gradient(180deg,#fff2c4,#e0a94a);box-shadow:0 0 12px rgba(255,210,90,.6),inset 0 0 0 1px #fff3c0}
.acc{font-size:.72em;color:var(--ink2);text-shadow:0 1px 3px #000} #h-tr{display:none;color:var(--info);font-weight:800;font-size:.72em;letter-spacing:.1em} #h-tr.on{display:block}
#quest{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:132px;max-width:330px;background:var(--glass,rgba(10,16,30,.5));backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,236,200,.22);border-radius:12px;padding:8px 12px 8px 14px;font-size:.8em;display:none;border-left:3px solid var(--ok)}
#quest.on{display:block} #quest b{color:var(--ok);margin-right:6px;letter-spacing:.14em;font-family:var(--cinzel);font-size:.82em} #quest small{display:block;color:var(--ink3);margin-top:2px}
#bossbar{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,70vw);opacity:0;transition:opacity .4s}
#bossbar.on{opacity:1} #bossbar .bn{font-family:var(--cinzel);font-weight:600;letter-spacing:.18em;font-size:.92em;text-align:center;text-shadow:0 2px 8px #000;margin-bottom:6px;color:#ffd8b0;text-transform:uppercase}
#bossbar .bn small{display:block;font-family:var(--body,"Alegreya Sans",sans-serif);font-size:.72em;letter-spacing:.08em;text-transform:none;color:#e8d8c8;opacity:.85;margin-top:2px;font-weight:500;font-style:italic}
#bossbar .hb{height:14px} #bossbar .hb i:not(.ghost){background:linear-gradient(180deg,#ffb07a,#d8401e 55%,#8a1a0a)}
#bossbar .hb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.45) calc(10% - 1px) 10%)}
#area{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-size:2.3em;color:#fff6dc;text-shadow:0 3px 14px rgba(0,0,0,.7);opacity:0;pointer-events:none;white-space:nowrap}
#area.on{animation:area 3.2s ease forwards}
@keyframes area{0%{opacity:0;letter-spacing:.4em}15%{opacity:1;letter-spacing:.08em}80%{opacity:1}100%{opacity:0}}
#prompt{position:fixed;left:0;top:0;background:rgba(10,14,26,.82);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,236,200,.4),0 4px 14px rgba(0,0,0,.4);border-radius:999px;padding:4px 12px 4px 5px;font-weight:700;font-size:.8em;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;z-index:5}
#prompt.on{opacity:1}
#toasts{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:6;max-width:min(520px,60vw)}
.toast{background:rgba(10,14,26,.72);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,236,200,.18);border-left:3px solid var(--info);border-radius:10px;padding:8px 12px;font-size:.84em;animation:tin .25s ease;transition:opacity .4s,transform .4s}
.toast.imp{border-left-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,236,200,.3),0 0 18px rgba(255,210,90,.25)} .toast small{display:block;color:var(--ink3);margin-top:2px} .toast.out{opacity:0;transform:translateX(-20px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.9);text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:6}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
body:has(#brawl.on) #banner{top:44%}
#banner .b-en{font-family:var(--comic);font-size:3.2em;letter-spacing:.04em;-webkit-text-stroke:2px #1a0f14;text-shadow:0 4px 0 #1a0f14,0 0 30px rgba(0,0,0,.6)}
#banner.bigb .b-en{font-size:4.4em} #banner .b-es{font-size:.95em;color:var(--ink);background:rgba(10,14,26,.7);backdrop-filter:blur(8px);display:inline-block;padding:4px 14px;border-radius:999px;margin-top:6px}
#ultbanner{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%) skewY(-4deg);pointer-events:none;opacity:0;z-index:6}
#ultbanner.on{animation:ult 2.2s ease forwards}
#ultbanner .u-name{font-family:var(--comic);font-size:5.2em;text-align:center;color:#fff;letter-spacing:.06em;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 20%,rgba(0,0,0,.75) 80%,transparent);text-shadow:0 0 24px var(--uc),0 0 4px #fff}
#ultbanner .u-sub{text-align:center;font-family:var(--cinzel,var(--display));letter-spacing:.2em;color:var(--gold);font-size:1.1em}
@keyframes ult{0%{opacity:0;transform:translateY(-50%) skewY(-4deg) translateX(-40%)}12%{opacity:1;transform:translateY(-50%) skewY(-4deg) translateX(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-50%) skewY(-4deg) translateX(30%)}}
#seal{position:fixed;left:50%;top:18px;transform:translateX(-50%);display:none;gap:8px;font-size:1.4em;background:rgba(10,14,26,.78);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px var(--gold);border-radius:999px;padding:6px 18px;z-index:7}
#seal.on{display:flex} #seal .ok{color:var(--ok)} #seal .bad{color:var(--bad)} #seal b{color:var(--gold);font-size:.8em;align-self:center}
#brawl{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(10,14,26,.78);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(143,216,255,.6);border-radius:14px;padding:10px 22px;text-align:center;display:none;z-index:5;max-width:80vw}
#brawl.on{display:block} #brawl .br-s{font-size:1.5em;font-weight:800} #brawl .br-es{color:var(--ink3);font-size:.85em} #brawl .br-h{color:var(--info);font-size:.75em;margin-top:2px}
.gap{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--gold);color:var(--gold);text-align:center;padding:0 .2em}
#note{position:fixed;right:18px;top:200px;max-width:360px;background:rgba(40,14,20,.82);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,106,106,.45);border-radius:12px;padding:8px 12px;font-size:.82em;opacity:0;transform:translateX(20px);transition:all .35s;pointer-events:none;z-index:5}
#note.on{opacity:1;transform:none} #note b{color:var(--bad)} #note small{display:block;color:var(--ink2)} #note mark{background:none;color:var(--gold);font-weight:800}

/* ---------- PREGUNTA ---------- */
#qpanel{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);width:min(980px,calc(100vw - 32px));background:var(--panel2);border:2px solid var(--gold);border-radius:18px;padding:16px 22px 12px;box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 0 6px rgba(255,210,90,.06);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:8}
#qpanel.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#qpanel.v-ok{border-color:var(--ok);box-shadow:0 0 40px rgba(107,227,138,.45)} #qpanel.v-bad{border-color:var(--bad);animation:shake .35s} #qpanel.v-sp{border-color:var(--spell)}
@keyframes shake{25%{transform:translate(calc(-50% - 8px),0)}75%{transform:translate(calc(-50% + 8px),0)}}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q-kind{font-family:var(--comic);font-size:1.3em;letter-spacing:.06em;color:var(--gold)} .q-unit{font-size:.78em;color:var(--ink2)}
.q-instr{color:var(--ink3);font-size:.8em;margin-top:2px}
.q-sentence{font-size:2.05em;font-weight:800;margin:.25em 0 .1em;line-height:1.25;text-wrap:balance}
.q-sentence .ctx{color:var(--ink3);font-weight:600}
.q-sentence.build .line{display:inline-flex;gap:.3em;min-width:5em;min-height:1.3em;border-bottom:3px dashed var(--gold);padding:0 .2em;vertical-align:bottom;flex-wrap:wrap}
.placed{color:var(--gold);animation:tin .15s}
.q-es{color:var(--ink2);font-size:1em;font-style:italic;min-height:1.2em} .q-es.hidden{visibility:hidden}
#q-input{font:inherit;font-weight:800;color:var(--gold);background:rgba(255,210,90,.08);border:0;border-bottom:3px solid var(--gold);width:7em;text-align:center;padding:0 .2em;outline:none}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 6px}
.opt{display:flex;align-items:center;gap:12px;background:#24203a;border:2px solid #3e3858;border-radius:14px;padding:12px 16px;font-size:1.35em;font-weight:800;cursor:pointer;text-align:left;transition:transform .1s,border-color .1s,background .1s}
.opt:hover,.opt.focus{border-color:var(--gold);transform:translateY(-2px);background:#2e2848}
.opt .gly{font-size:.85em;min-width:2em;height:2em}
.opt.right{border-color:var(--ok);background:rgba(107,227,138,.18)} .opt.wrong{border-color:var(--bad);background:rgba(255,106,106,.15)} .opt.dim{opacity:.3}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.tile{background:#2a2540;border:2px solid #4a4268;border-radius:10px;padding:8px 14px;font-size:1.25em;font-weight:800;cursor:pointer} .tile.focus,.tile:hover{border-color:var(--gold)} .tile.used{opacity:.25}
.tile-ctrl{display:flex;gap:10px} .tc{background:#24203a;border:2px solid #3e3858;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.85em;display:flex;align-items:center;gap:6px} .tc.primary{border-color:var(--gold)}
.type-hint{color:var(--ink3);font-size:.8em;margin:8px 0}
.q-foot{display:flex;gap:18px;justify-content:flex-end;color:var(--ink3);font-size:.72em;margin-top:4px;flex-wrap:wrap} .q-foot span{display:flex;gap:6px;align-items:center}
/* --- panel de pregunta: pergamino de cristal (misma dirección que el HUD) --- */
#qpanel{background:linear-gradient(180deg,rgba(28,24,40,.88),rgba(14,12,22,.94));backdrop-filter:blur(14px);border:0;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(255,226,170,.35),inset 0 0 0 5px rgba(10,8,16,.6),inset 0 0 0 6px rgba(255,210,120,.12),0 24px 70px rgba(0,0,0,.65);padding:20px 26px 14px}
#qpanel::before{content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);width:220px;height:14px;background:radial-gradient(circle at 50% 50%,var(--gold) 0 4px,transparent 5px),linear-gradient(90deg,transparent,rgba(255,210,90,.9) 30%,rgba(255,210,90,.9) 45%,transparent 46% 54%,rgba(255,210,90,.9) 55%,rgba(255,210,90,.9) 70%,transparent) center/100% 1.5px no-repeat;pointer-events:none}
#qpanel.v-ok{box-shadow:inset 0 0 0 2px var(--ok),0 0 50px rgba(107,227,138,.4),0 24px 70px rgba(0,0,0,.65)} #qpanel.v-bad{box-shadow:inset 0 0 0 2px var(--bad),0 0 40px rgba(255,106,106,.3),0 24px 70px rgba(0,0,0,.65)} #qpanel.v-sp{box-shadow:inset 0 0 0 2px var(--spell),0 24px 70px rgba(0,0,0,.65)}
.q-kind{font-family:var(--cinzel);font-weight:700;font-size:.95em;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.q-unit{font-size:.74em;color:var(--ink2);letter-spacing:.04em}
.q-sentence{font-size:2.1em;letter-spacing:.005em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.opt{background:linear-gradient(180deg,rgba(255,240,210,.07),rgba(255,240,210,.02));border:0;box-shadow:inset 0 0 0 1.5px rgba(255,226,170,.18);border-radius:14px;padding:11px 16px;font-size:1.3em;position:relative;overflow:hidden}
.opt::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 45%,transparent 60%);transform:translateX(-120%);transition:transform .45s}
.opt:hover,.opt.focus{background:linear-gradient(180deg,rgba(255,210,90,.18),rgba(255,210,90,.06));box-shadow:inset 0 0 0 2px var(--gold),0 6px 18px rgba(0,0,0,.35);transform:translateY(-2px)}
.opt:hover::after,.opt.focus::after{transform:translateX(120%)}
.opt .gly{border-radius:50%;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px currentColor;border:0;padding:0;width:1.7em;min-width:1.7em;height:1.7em;font-size:.8em;display:inline-flex;align-items:center;justify-content:center}
